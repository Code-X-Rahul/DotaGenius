services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dotagenius
      POSTGRES_PASSWORD: dotagenius
      POSTGRES_DB: dotagenius
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  parser:
    image: odota/parser
    ports:
      - "5600:5600"

volumes:
  pgdata:
  redisdata:
